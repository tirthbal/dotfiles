# -- general -------------------------------------------------------------------

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*:RGB"
set-option -g status-position top

# List plugins
set -g @plugin 'catppuccin/tmux#v2.3.0'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'fcsonline/tmux-thumbs'
#set -g @plugin 'christoomey/vim-tmux-navigator'

# catppuccin plugin options
set -g @catppuccin_flavor 'mocha'                    # latte | frappe | macchiato | mocha
set -g @catppuccin_window_status_style 'slanted'     # native slant separators

# status line modules (session, cwd, hostname, clock) — see status-left/right below

%if #{>=:#{s/^[^0-9]+//:#{version}},3.2}
set -gF extended-keys '#{?#{||:#{m/ri:mintty|iTerm|WezTerm|ghostty,#{TERM_PROGRAM}},#{!=:#{XTERM_VERSION},}},on,off}' # needed by Control + Shift bindings
%endif
%if #{>=:#{s/^[^0-9]+//:#{version}},3.3}
set -gF extended-keys '#{?#{||:#{m/ri:mintty|iTerm|WezTerm|ghostty,#{TERM_PROGRAM}},#{!=:#{XTERM_VERSION},}},always,off}' # needed by Control + Shift bindings
%endif
%if #{>=:#{s/^[^0-9]+//:#{version}},3.5}
set -g extended-keys-format csi-u
%endif
set -s escape-time 10                     # faster command sequences
set -sg repeat-time 600                   # increase repeat timeout
set -s focus-events on


unbind C-b
set -g prefix C-a                        # GNU-Screen compatible prefix
set -g prefix2 C-a                        # GNU-Screen compatible prefix
bind C-a send-prefix -2


setw -g mode-keys vi
set -g renumber-windows on       # renumber all windows when any window is closed
set -g set-clipboard on          # use system clipboard
set -g history-limit 5000                 # boost history

# edit configuration
bind e new-window -n "#{TMUX_CONF_LOCAL}" sh -c '_E=${VISUAL:-${EDITOR:-vim}}; case "$_E" in *vim*) $_E -c ":set syntax=tmux" "$TMUX_CONF_LOCAL";; *) $_E "$TMUX_CONF_LOCAL";; esac && "$TMUX_PROGRAM" ${TMUX_SOCKET:+-S "$TMUX_SOCKET"} source "$TMUX_CONF" \; display "Configuration reloaded"'

# reload configuration
bind r run "sh -c '\"\$TMUX_PROGRAM\" \${TMUX_SOCKET:+-S \"\$TMUX_SOCKET\"} source \"\$TMUX_CONF\"'" \; display "Configuration reloaded"


# -- display -------------------------------------------------------------------

set -g base-index 1           # start windows numbering at 1
bind  0 select-window -t :=10 # and make <prefix> 0 select window with index 10
setw -g pane-base-index 1     # make pane numbering consistent with windows

setw -g automatic-rename on   # rename window to reflect current program
set -g renumber-windows on    # renumber windows when a window is closed

set -g set-titles on          # set terminal title

set -g display-panes-time 800 # slightly longer pane indicators display time
set -g display-time 1000      # slightly longer status messages display time

set -g status-interval 10     # redraw status line every 10 seconds

# clear both screen and history
bind -n C-l send-keys C-l \; run 'sleep 0.2' \; clear-history

# activity
set -g monitor-activity on
set -g visual-activity off


# -- navigation ----------------------------------------------------------------

# create session
bind C-c new-session

# find session
bind C-f command-prompt -p '(find-session)' 'switch-client -t %%'

# session navigation
bind BTab switch-client -l  # move to last session

# split current window horizontally
bind - split-window -v
# split current window vertically
bind | split-window -h

# pane navigation
bind -r h select-pane -L  # move left
bind -r j select-pane -D  # move down
bind -r k select-pane -U  # move up
bind -r l select-pane -R  # move right
bind > swap-pane -D       # swap current pane with the next one
bind < swap-pane -U       # swap current pane with the previous one

# maximize current pane
bind + run "cut -c3- '#{TMUX_CONF}' | sh -s _maximize_pane '#{session_name}' '#D'"

# pane resizing
bind -r H resize-pane -L 2
bind -r J resize-pane -D 2
bind -r K resize-pane -U 2
bind -r L resize-pane -R 2

# window navigation
#unbind n
#unbind p
unbind C-l
#bind -r C-h previous-window                             # select previous window
#bind -r C-l next-window                                 # select next window
bind -r C-S-H swap-window -t -1 \; select-window -t -1  # swap current window with the previous one
bind -r C-S-L swap-window -t +1 \; select-window -t +1  # swap current window with the next one
bind Tab last-window                                    # move to last active window

# toggle mouse
bind m set -gF mouse '#{?mouse,off,on}' \; display "mouse: #{?mouse,on,off}"

# don't rename windows automatically
set-option -g allow-rename off
set -g automatic-rename off
set -g automatic-rename-format '#{pane_current_command}'


# -- facebook pathpicker -------------------------------------------------------

bind F run "cut -c3- '#{TMUX_CONF}' | sh -s _fpp '#{pane_id}'"


# -- copy mode -----------------------------------------------------------------

bind Enter copy-mode # enter copy mode

bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel
bind -T copy-mode-vi H send -X start-of-line
bind -T copy-mode-vi L send -X end-of-line

# copy to X11 clipboard
if -b 'command -v xsel > /dev/null 2>&1' 'bind y run -b "\"\$TMUX_PROGRAM\" \${TMUX_SOCKET:+-S \"\$TMUX_SOCKET\"} save-buffer - | xsel -i -b"'
if -b '! command -v xsel > /dev/null 2>&1 && command -v xclip > /dev/null 2>&1' 'bind y run -b "\"\$TMUX_PROGRAM\" \${TMUX_SOCKET:+-S \"\$TMUX_SOCKET\"} save-buffer - | xclip -i -selection clipboard >/dev/null 2>&1"'
# copy to Wayland clipboard
if -b '[ "$XDG_SESSION_TYPE" = "wayland" ] && command -v wl-copy > /dev/null 2>&1' 'bind y run -b "\"\$TMUX_PROGRAM\" \${TMUX_SOCKET:+-S \"\$TMUX_SOCKET\"} save-buffer - | wl-copy"'
# copy to macOS clipboard
if -b 'command -v pbcopy > /dev/null 2>&1' 'bind y run -b "\"\$TMUX_PROGRAM\" \${TMUX_SOCKET:+-S \"\$TMUX_SOCKET\"} save-buffer - | pbcopy"'
# copy to Windows clipboard
if -b 'command -v clip.exe > /dev/null 2>&1' 'bind y run -b "\"\$TMUX_PROGRAM\" \${TMUX_SOCKET:+-S \"\$TMUX_SOCKET\"} save-buffer - | clip.exe"'
if -b '[ -c /dev/clipboard ]' 'bind y run -b "\"\$TMUX_PROGRAM\" \${TMUX_SOCKET:+-S \"\$TMUX_SOCKET\"} save-buffer - > /dev/clipboard"'





# initialize tpm plugin

run '~/.config/tmux/tpm/tpm'


# -- status bar: catppuccin modules ---------------------------------------------
set -g status-left ""
set -g status-left-length 100
set -g status-right-length 100
set -g status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_directory}"
set -ag status-right "#{E:@catppuccin_status_host}"
set -ag status-right "#{E:@catppuccin_status_date_time}"

# set -g window-status-format \
#   "#I:#{pane_current_command}#{?#{!=:#{window_name},#{pane_current_command}}, (#{window_name}),}"
#
# set -g window-status-current-format \
#   "#I:#{pane_current_command}#{?#{!=:#{window_name},#{pane_current_command}}, (#{window_name}),}"

#set -g @catppuccin_window_default_text "#{pane_current_command}#{?#{!=:#{window_name},#{pane_current_command}}, (#{window_name}),}"
set -g @catppuccin_window_default_text "#{window_name}"
set -g @catppuccin_window_current_text "#{pane_current_command}#{?#{!=:#{window_name},#{pane_current_command}}, (#{window_name}),}"
